            <!-- Collapsible Menu Section -->
            <section class="card collapsible-story" id="menu-widget-section" aria-labelledby="menu-toggle-trigger">

                    aria-expanded="false">
                    <span class="card-title" style="margin-bottom: 0;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            viewBox="0 0 16 16">
                            <path
                                d="M1.5 1.5A.5.5 0 0 0 1 2v12a.5.5 0 0 0 .5.5H7v-13H1.5zM8 1.5v13h5.5a.5.5 0 0 0 .5-.5V2a.5.5 0 0 0-.5-.5H8zM0 2a1.5 1.5 0 0 1 1.5-1.5h13A1.5 1.5 0 0 1 16 2v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14V2z" />

                    </span>
                    <span class="collapsible-icon-wrapper">
                        <svg class="collapsible-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"

                            <path fill-rule="evenodd"

                        style="background-color: transparent; border-top: none; padding-top: 0;">

                        <div class="menu-tabs" id="menu-tabs-bar" role="tablist" style="margin-top: 15px;">
                            <button class="menu-tab-btn active" id="tab-drip" onclick="switchMenuTab('drip', event)"
                                role="tab" aria-selected="true" data-i18n="tab-drip">القهوة المقطرة</button>
                            <button class="menu-tab-btn" id="tab-espresso" onclick="switchMenuTab('espresso', event)"
                                role="tab" aria-selected="false" data-i18n="tab-espresso">مشروبات الاسبريسو</button>
                            <button class="menu-tab-btn" id="tab-cold" onclick="switchMenuTab('cold', event)" role="tab"
                                aria-selected="false" data-i18n="tab-cold">المشروبات الباردة</button>
                            <button class="menu-tab-btn" id="tab-matcha" onclick="switchMenuTab('matcha', event)"
                                role="tab" aria-selected="false" data-i18n="tab-matcha">الماتشا</button>
                            <button class="menu-tab-btn" id="tab-sweet" onclick="switchMenuTab('sweet', event)"
                                role="tab" aria-selected="false" data-i18n="tab-sweet">السويت</button>
                        </div>

                        <!-- Menu Items Wrapper -->
                        <div class="menu-items-container" id="menu-items-list" aria-live="polite">
                            <!-- Dynamically injected by script.js -->
                        </div>

                        <!-- Scroll Down Hint -->
                        <div class="menu-scroll-hint" id="menu-scroll-hint-element" style="display: none;">

            </div>
